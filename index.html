<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuck You Quotes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ff4d4d, #ff9f43);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .quote-box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
      padding: 40px 30px;
      margin-bottom: 30px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .quote-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 50px rgba(255, 77, 77, 0.15);
    }

    .quote-text {
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 18px;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote-author {
      font-size: 0.9rem;
      color: #ff6b6b;
      font-weight: 500;
    }

    .btn {
      background: linear-gradient(135deg, #ff4d4d, #ff6b6b);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(255, 77, 77, 0.3);
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 28px rgba(255, 77, 77, 0.45);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 50px;
      font-size: 0.8rem;
      color: #555;
    }

    /* small animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quote-box.animate {
      animation: fadeIn 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fuck You Man</h1>
    <p class="subtitle">Some honest quotes for the soul</p>

    <div class="quote-box" id="quoteBox">
      <div class="quote-text" id="quoteText">Loading the fuck out of this...</div>
      <div class="quote-author" id="quoteAuthor">— Someone real</div>
    </div>

    <button class="btn" onclick="newQuote()">Give Me Another Fuck</button>

    <p class="footer">Made with zero fucks given</p>
  </div>

  <script>
    const quotes = [
      { text: "Fuck the haters. They’re just mad they can’t do what you do.", author: "Unknown Legend" },
      { text: "Just do the fucking thing. Perfect is the enemy of done.", author: "Real Talk" },
      { text: "If they don’t fuck with your vibe, they were never meant to.", author: "Street Wisdom" },
      { text: "Fuck excuses. Get up and make it happen.", author: "No Cap" },
      { text: "Some days you just have to say ‘fuck it’ and keep going.", author: "Survival Mode" },
      { text: "They said it couldn’t be done. Fuck them. Do it anyway.", author: "Rebel Energy" },
      { text: "Stop waiting for the perfect moment. Fuck it. Start now.", author: "Action Speaks" },
      { text: "Your only competition is who you were yesterday. Fuck the rest.", author: "Growth Mindset" },
      { text: "If it costs you your peace, it’s too fucking expensive.", author: "Self Respect" },
      { text: "Be so good they can’t ignore you. And if they still do? Fuck ‘em.", author: "Quiet Flex" },
      { text: "Not everyone deserves a front row seat in your life. Fuck the noise.", author: "Boundaries" },
      { text: "The best revenge is massive success. And a little ‘fuck you’ energy.", author: "Level Up" }
    ];

    function newQuote() {
      const box = document.getElementById('quoteBox');
      box.classList.remove('animate');
      
      // Force reflow
      void box.offsetWidth;
      
      const random = quotes[Math.floor(Math.random() * quotes.length)];
      document.getElementById('quoteText').textContent = `"${random.text}"`;
      document.getElementById('quoteAuthor').textContent = `— ${random.author}`;
      
      box.classList.add('animate');
    }

    // Load first quote
    newQuote();
  </script>
</body>
</html>
